<style>
*{box-sizing:border-box}body{margin:0;background:#f8f9fb;color:#343b50;font-family:ui-rounded,system-ui,-apple-system,sans-serif}
.app{min-height:100vh;max-width:1100px;margin:auto;padding:24px 28px 20px;display:grid;grid-template-rows:auto 1fr auto;gap:10px}
header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:30px;font-weight:900;letter-spacing:2px;color:#3e4964}.brand small{display:block;font-size:10px;letter-spacing:4px}.top-icons{font-size:24px;color:#44506a}
.content{display:grid;grid-template-columns:260px 1fr 270px;align-items:center;gap:25px;min-height:650px}
.card{background:#fff;border:1px solid #dce3ee;border-radius:20px;padding:20px;box-shadow:0 8px 30px #39435c0d}
.stats h2,.timerbox h2{font-size:16px;margin:0 0 22px}.stat{margin:18px 0}.statline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.bar{height:9px;border:1px solid #9eb8d3;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px;background:#69b7df}
.center{display:flex;align-items:center;justify-content:center;min-height:620px;position:relative}.heart{position:absolute;top:12%;left:14%;color:#72c9ef;font-size:25px}.star{position:absolute;right:13%;bottom:22%;color:#8993aa;font-size:24px}.character{width:min(390px,72vw);max-height:570px;object-fit:contain;filter:drop-shadow(0 16px 12px #42506c20);transition:.3s}
.outfit-home{filter:saturate(.75) brightness(1.04) drop-shadow(0 16px 12px #42506c20)}.outfit-sleep{filter:hue-rotate(35deg) saturate(.65) brightness(1.08) drop-shadow(0 16px 12px #42506c20)}.outfit-hoodie{filter:hue-rotate(-12deg) saturate(.9) brightness(.86) drop-shadow(0 16px 12px #42506c20)}.outfit-pink{filter:hue-rotate(285deg) saturate(1.3) brightness(1.04) drop-shadow(0 16px 12px #42506c20)}.outfit-cyber{filter:hue-rotate(145deg) saturate(1.15) contrast(1.05) drop-shadow(0 16px 12px #42506c20)}
.speech{position:absolute;top:5%;right:8%;padding:10px 14px;background:#fff;border:1px solid #d7deea;border-radius:14px;font-size:12px}
.timerbox{text-align:center}.timer{font-size:55px;font-weight:900;letter-spacing:2px;margin:25px 0;color:#38445e}.circle{width:205px;height:205px;border:4px solid #75b5dc;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;position:relative}.play{width:55px;height:55px;border-radius:50%;border:0;background:#3f4a64;color:#fff;font-size:21px;cursor:pointer;position:absolute;bottom:28px;left:calc(50% - 27px)}button{font:inherit;cursor:pointer}.modes{display:flex;gap:7px;justify-content:center;margin-bottom:8px}.modes button,.reset{border:1px solid #cbd6e4;background:#fff;color:#46516a;border-radius:12px;padding:8px 13px}.modes .active{background:#6eadd3;color:#fff;border-color:#6eadd3}.reset{width:100%;margin-top:8px}.bottom{border-top:1px solid #dce3ee;padding-top:13px;display:flex;justify-content:center;gap:45px;flex-wrap:wrap}.action{border:0;background:transparent;font-size:14px;min-width:85px;color:#46516a}.action span{display:block;font-size:26px;margin-bottom:4px}.action:hover{color:#4f9dcc;transform:translateY(-2px)}
.modal{position:fixed;inset:0;background:#33405a55;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:20px;padding:22px;max-width:620px;width:100%;box-shadow:0 20px 70px #27324b40}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.close{border:0;background:#eef2f7;border-radius:50%;width:35px;height:35px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.choice{border:1px solid #d5deea;background:#fafcff;border-radius:14px;padding:13px;text-align:center;color:#46516a}.choice.selected{outline:2px solid #70b7df}.choice b{display:block;margin-top:5px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#3e4964;color:white;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:850px){.content{grid-template-columns:1fr;min-height:0}.center{min-height:500px;order:-1}.character{width:min(330px,78vw)}.card{max-width:520px;margin:auto;width:100%}.bottom{gap:8px}}

<section class="card timerbox"><h2>Pomodoro</h2><div class="circle"><div class="timer" id="timer">25:00</div><button class="play" id="start">▶</button></div><div class="modes"><button data-min="15">15</button><button data-min="25" class="active">25</button><button data-min="45">45</button></div><button class="reset" id="reset">↻ Сбросить</button><p style="font-size:12px;opacity:.6">Фокусируйся на важном — я рядом ♥</p></section></div>
<nav class="bottom"><button class="action" id="feed"><span>🍔</span>Кормить</button><button class="action" id="playGame"><span>🎮</span>Играть</button><button class="action" id="rest"><span>🛏</span>Отдых</button><button class="action" id="wardrobe"><span>♧</span>Гардероб</button><button class="action" id="ach"><span>☆</span>Достижения</button></nav></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Гардероб</h2><button class="close" id="close">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const def={hunger:70,mood:70,energy:60,clean:80,sessions:0,streak:0,xp:0,level:1,outfit:'classic'};
let S;try{S=JSON.parse(localStorage.getItem('jinxMinimal')||'null')||{...def}}catch(e){S={...def}}
let remain=1500,total=1500,running=false,iv=null;
function save(){try{localStorage.setItem('jinxMinimal',JSON.stringify(S))}catch(e){}}
function clamp(n){return Math.max(0,Math.min(100,Math.round(n)))}
function render(){const names=[['🍴','Голод','hunger'],['♥','Настроение','mood'],['⚡','Энергия','energy'],['💧','Чистота','clean']];$('#stats').innerHTML=names.map(x=>`<div class="stat"><div class="statline"><span>${x[0]} ${x[1]}</span><b>${S[x[2]]}%</b></div><div class="bar"><div class="fill" style="width:${S[x[2]]}%"></div></div></div>`).join('');$('#timer').textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');$('#jinx').className='character outfit-'+S.outfit}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function say(t){$('#speech').textContent=t;toast(t)}
function change(a,b,c,msg){S.hunger=clamp(S.hunger+a);S.mood=clamp(S.mood+b);S.energy=clamp(S.energy+c);save();render();say(msg)}
$('#feed').onclick=()=>openFood();$('#playGame').onclick=()=>change(-5,18,-12,'Ха! Ещё раз!');$('#rest').onclick=()=>change(0,5,25,'Zzz... немного отдыха.');
function openFood(){$('#modalTitle').textContent='Чем покормить?';$('#modalBody').innerHTML='<div class="choices">'+[['🧁','Кекс',20],['🍔','Бургер',30],['🍬','Конфета',15],['🐟','Рыба',25],['🥤','Напиток',10],['🍕','Пицца',35]].map(x=>`<button class="choice" data-food="${x[2]}">${x[0]}<b>${x[1]}</b><small>+${x[2]} голода</small></button>`).join('')+'</div>';$('#modal').classList.add('open');document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{S.hunger=clamp(S.hunger+ +b.dataset.food);S.mood=clamp(S.mood+4);save();render();say('М-м! Спасибо ♥');$('#modal').classList.remove('open')})}
$('#wardrobe').onclick=()=>{const o=[['classic','💙','Классика'],['home','🏠','Домашний'],['sleep','🌙','Пижама'],['hoodie','🖤','Капюшон'],['cyber','⚡','Киберпанк'],['pink','💗','Праздничный']];$('#modalTitle').textContent='Гардероб';$('#modalBody').innerHTML='<div class="choices">'+o.map(x=>`<button class="choice ${S.outfit===x[0]?'selected':''}" data-outfit="${x[0]}">${x[1]}<b>${x[2]}</b></button>`).join('')+'</div>';$('#modal').classList.add('open');document.querySelectorAll('[data-outfit]').forEach(b=>b.onclick=()=>{S.outfit=b.dataset.outfit;save();render();say('Этот образ мне нравится!');$('#modal').classList.remove('open')})};
$('#ach').onclick=()=>{$('#modalTitle').textContent='Достижения';$('#modalBody').innerHTML=`<div class="choices"><div class="choice">⭐<b>${S.sessions}</b><small>фокус-сессий</small></div><div class="choice">🔥<b>${S.streak}</b><small>завершено</small></div><div class="choice">💜<b>Ур. ${S.level}</b><small>опыт ${S.xp}</small></div></div>`;$('#modal').classList.add('open')};
$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{if(running)return;total=+b.dataset.min*60;remain=total;document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
$('#start').onclick=()=>{if(running){clearInterval(iv);running=false;$('#start').textContent='▶';say('Пауза. Когда будешь готов — продолжим.');return}running=true;$('#start').textContent='Ⅱ';say('Фокусируемся вместе ♥');iv=setInterval(()=>{remain--;render();if(remain<=0){clearInterval(iv);running=false;S.sessions++;S.streak++;S.xp+=50;S.mood=clamp(S.mood+15);S.energy=clamp(S.energy-5);if(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;say('Новый уровень! ⭐')}else say('Готово! Ты справился ♥');save();remain=total;$('#start').textContent='▶';render()}},1000)};
$('#reset').onclick=()=>{clearInterval(iv);running=false;remain=total;$('#start').textContent='▶';render()};
setInterval(()=>{if(!running){S.hunger=clamp(S.hunger-1);S.energy=clamp(S.energy-1);S.clean=clamp(S.clean-1);save();render()}},60000);render();
</script></body></html>
