<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jinx Tamagotchi — Focus Companion</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><div class="logo">JINX <small>TAMAGOTCHI</small></div><div class="quote" id="quote">Маленькая хаоска больших мечт ♡</div><div class="top"><span>🔥 <b id="streak">0</b></span><span>⭐ Ур. <b id="level">1</b></span></div></header>
<main><aside class="side panel"><h2>Состояние</h2><div id="stats"></div><hr><p id="speech">Ну что, работаем?</p><button onclick="act('feed')">🍖 Покормить</button><button onclick="act('play')">🎮 Поиграть</button><button onclick="act('rest')">🛏️ Отдых</button><button onclick="show('wardrobe')">👗 Гардероб</button></aside>
<section class="room"><img src="jinx_room.png" class="scene"><div class="bubble" id="bubble">Zzz... ♥</div><div class="roomActions"><button onclick="act('feed')">🍴</button><button onclick="act('play')">🎮</button><button onclick="act('rest')">🛏</button></div></section>
<aside class="panel pomo"><h2>⏱ Pomodoro</h2><div class="modes"><button data-min="15">15 мин</button><button class="selected" data-min="25">25 мин</button><button data-min="45">45 мин</button></div><div class="timer" id="timer">25:00</div><button class="primary" id="start">▶ Начать фокус</button><button id="reset">↻ Сбросить</button><p>Закончи сессию — Jinx получит опыт и настроение.</p><div class="sessions">⭐ Завершено: <b id="sessions">0</b></div></aside></main>
<section class="lower panel" id="wardrobe"><div><h2>👗 Гардероб</h2><p>Выбери образ для Jinx</p></div><div class="outfits"><button data-outfit="classic">💙 Обычный</button><button data-outfit="home">🏠 Домашний</button><button data-outfit="sleep">🌙 Пижама</button><button data-outfit="hoodie">🖤 Капюшон</button><button data-outfit="cyber">⚡ Киберпанк</button><button data-outfit="pink">💗 Праздничный</button></div></section>
<section class="lower panel food"><h2>🍴 Кормление</h2><div class="foodgrid"><button onclick="food(20)">🧁<small>Кекс<br>+20 ♥</small></button><button onclick="food(30)">🍔<small>Бургер<br>+30 ♥</small></button><button onclick="food(15)">🍬<small>Конфета<br>+15 ♥</small></button><button onclick="food(25)">🐟<small>Рыба<br>+25 ♥</small></button></div></section>
<footer>Забота + Фокус = Счастье · 💾 прогресс сохраняется автоматически</footer></div><script src="game.js"></script></body></html>
