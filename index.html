<title>Jinx Tamagotchi</title>

<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#354057;font-family:ui-rounded,system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}
.app{min-height:100vh;max-width:1120px;margin:auto;padding:20px 28px 16px;display:grid;grid-template-rows:auto 1fr auto;gap:8px}
header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:29px;font-weight:900;letter-spacing:2px}.brand small{display:block;font-size:9px;letter-spacing:4px}.coins{background:#fff;border:1px solid #d9e1ec;border-radius:13px;padding:9px 14px;font-weight:800}
.content{display:grid;grid-template-columns:245px 1fr 275px;gap:20px;align-items:center;min-height:650px}.card{background:#fff;border:1px solid #dce3ee;border-radius:20px;padding:19px;box-shadow:0 8px 30px #39435c0d}.card h2{font-size:16px;margin:0 0 20px}
.stat{margin:17px 0}.statline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.bar{height:8px;border:1px solid #9eb8d3;border-radius:10px;overflow:hidden}.fill{height:100%;background:#69b7df;border-radius:10px}
.center{min-height:620px;display:flex;align-items:center;justify-content:center;position:relative}.character{width:min(400px,74vw);max-height:570px;object-fit:contain;filter:drop-shadow(0 16px 12px #42506c20);transition:.35s}.character.sleep{display:none}.sleeping{display:none;width:min(520px,82vw);max-height:360px;object-fit:contain;filter:drop-shadow(0 14px 12px #42506c15)}.sleeping.on{display:block}
.speech{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #d4ddea;border-radius:18px;padding:11px 16px;box-shadow:0 8px 25px #39435c12;font-size:13px;white-space:nowrap;max-width:270px;text-align:center}.speech:after{content:"";position:absolute;bottom:-8px;left:50%;width:15px;height:15px;background:#fff;border-right:1px solid #d4ddea;border-bottom:1px solid #d4ddea;transform:rotate(45deg)}
.outfitBadge{position:absolute;top:18%;right:13%;background:#fff;border:1px solid #dce3ee;border-radius:12px;padding:7px 10px;font-size:11px;display:none}.outfitBadge.show{display:block}
/* Distinct outfit overlays */
.overlay{position:absolute;display:none;z-index:3;pointer-events:none}.overlay.on{display:block}
.hood{top:18%;left:calc(50% - 103px);width:206px;height:145px;border-radius:50% 50% 42% 42%;border:7px solid #343c55;background:#4b526b99;transform:rotate(-2deg);mix-blend-mode:multiply}.hood:after{content:"";position:absolute;left:37px;top:36px;width:118px;height:70px;border:5px solid #222a40;border-radius:48%;opacity:.75}
.home{top:42%;left:calc(50% - 105px);width:210px;height:155px;border-radius:35px;background:#f0b5cfaa;border:5px solid #9d7895;transform:rotate(-2deg);mix-blend-mode:multiply}.home:after{content:"♡";font-size:38px;position:absolute;right:22px;top:48px;color:#d56eaa}
.pajama{top:42%;left:calc(50% - 110px);width:220px;height:160px;border-radius:28px;background:#88cbe8aa;border:5px solid #4d8fb2;transform:rotate(1deg);mix-blend-mode:multiply}.pajama:before,.pajama:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;opacity:.8}.pajama:before{left:40px;top:25px}.pajama:after{right:45px;bottom:25px}
.pink{top:28%;left:calc(50% - 115px);width:230px;height:190px;border-radius:40px;background:#f3a9d5aa;border:5px solid #c56da8;transform:rotate(-1deg);mix-blend-mode:multiply}
.cyber{top:30%;left:calc(50% - 120px);width:240px;height:205px;border-radius:25px;background:#6fe0e066;border:5px dashed #35a4a4;transform:rotate(2deg);mix-blend-mode:multiply}
.timerbox{text-align:center}.circle{width:205px;height:205px;border:4px solid #75b5dc;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;position:relative}.timer{font-size:49px;font-weight:900;color:#38445e}.play{width:55px;height:55px;border-radius:50%;border:0;background:#3f4a64;color:#fff;font-size:20px;position:absolute;bottom:27px;left:calc(50% - 27px)}.modes{display:flex;gap:7px;justify-content:center}.modes button,.reset{border:1px solid #cbd6e4;background:#fff;color:#46516a;border-radius:12px;padding:8px 13px}.modes .active{background:#6eadd3;color:#fff;border-color:#6eadd3}.reset{width:100%;margin-top:8px}.reward{margin-top:13px;background:#f5f8fc;border-radius:11px;padding:9px;font-size:12px}
.bottom{border-top:1px solid #dce3ee;padding-top:12px;display:flex;justify-content:center;gap:30px;flex-wrap:wrap}.action{border:0;background:transparent;color:#46516a;min-width:90px}.action span{display:block;font-size:26px;margin-bottom:4px}.action:hover{color:#4f9dcc;transform:translateY(-2px)}
.modal{position:fixed;inset:0;background:#33405a55;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;border-radius:20px;padding:21px;max-width:700px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 70px #27324b40}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.close{border:0;background:#eef2f7;border-radius:50%;width:35px;height:35px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.choice{border:1px solid #d5deea;background:#fafcff;border-radius:14px;padding:13px;text-align:center;color:#46516a}.choice.selected{outline:2px solid #70b7df}.choice b{display:block;margin-top:5px}.choice small{display:block;margin-top:3px}.gamegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:300px;margin:15px auto}.gamecell{aspect-ratio:1;border:1px solid #ccd7e5;background:#f8fbfe;border-radius:10px;font-size:32px}.sudoku{max-width:315px}.sudoku .gamecell{font-size:22px}.sudoku .fixed{font-weight:900;background:#edf5fb}.status{text-align:center;font-size:13px;margin:10px}.bombarea{position:relative;height:330px;border:1px solid #d9e1ec;border-radius:16px;background:#f6f9fc;overflow:hidden}.bomb{position:absolute;border:0;background:transparent;font-size:28px}.catcher{position:absolute;bottom:10px;left:50%;font-size:28px;transform:translateX(-50%);pointer-events:none}
.foodcost{font-size:11px;color:#69758b}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#3e4964;color:#fff;padding:10px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
@media(max-width:850px){.content{grid-template-columns:1fr;min-height:0}.center{min-height:500px;order:-1}.card{max-width:520px;margin:auto;width:100%}.bottom{gap:7px}}
</style></head>

<button class="action" id="feed"><span>🍔</span>Кормить</button><button class="action" id="games"><span>🎮</span>Мини-игры</button><button class="action" id="rest"><span>🛏</span>Отдых</button><button class="action" id="wardrobe"><span>👗</span>Гардероб</button><button class="action" id="ach"><span>☆</span>Достижения</button>
</nav></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" id="close">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const DEF={coins:0,hunger:65,mood:75,energy:65,clean:80,sessions:0,xp:0,level:1,outfit:'classic'};
let S;try{S=JSON.parse(localStorage.getItem('jinxFinal')||'null')||{...DEF}}catch(e){S={...DEF}}
let remain=1500,total=1500,running=false,iv=null,sleeping=false;
const rewards={15:10,25:20,45:30};
function save(){try{localStorage.setItem('jinxFinal',JSON.stringify(S))}catch(e){}}
function clamp(x){return Math.max(0,Math.min(100,Math.round(x)))}
function render(){const a=[['🍴','Голод','hunger'],['♥','Настроение','mood'],['⚡','Энергия','energy'],['💧','Чистота','clean']];$('#stats').innerHTML=a.map(x=>`<div class="stat"><div class="statline"><span>${x[0]} ${x[1]}</span><b>${S[x[2]]}%</b></div><div class="bar"><div class="fill" style="width:${S[x[2]]}%"></div></div></div>`).join('');$('#coins').textContent=S.coins;$('#level').textContent=S.level;$('#xp').textContent=S.xp;$('#timer').textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');$('#rewardCoins').textContent=(rewards[Math.round(total/60)]||20)+' 🪙';updateOutfit();updateSleep()}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function say(t){$('#speech').textContent=t;toast(t)}
function updateSleep(){if(sleeping){$('#jinx').classList.add('sleep');$('#sleepImg').classList.add('on')}else{$('#jinx').classList.remove('sleep');$('#sleepImg').classList.remove('on')}}
function updateOutfit(){['hood','home','pajama','pink','cyber'].forEach(x=>$('#'+x).classList.remove('on'));const map={hoodie:'hood',home:'home',sleep:'pajama',pink:'pink',cyber:'cyber'};if(map[S.outfit]&&!sleeping)$('#'+map[S.outfit]).classList.add('on');let names={classic:'Классика',hoodie:'Капюшон',home:'Домашний',sleep:'Пижама',pink:'Праздничный',cyber:'Киберпанк'};$('#outfitBadge').textContent=names[S.outfit];$('#outfitBadge').classList.toggle('show',!sleeping)}
function act(a,b,c,msg){S.hunger=clamp(S.hunger+a);S.mood=clamp(S.mood+b);S.energy=clamp(S.energy+c);save();render();say(msg)}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
$('#close').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#feed').onclick=()=>{if(S.coins<5){say('Нужны монетки! Проведи фокус-сессию 🪙');return}openFood()};
function openFood(){const food=[['🧁','Кекс',5,15],['🍔','Бургер',8,25],['🍬','Конфета',4,10],['🐟','Рыба',7,20],['🍕','Пицца',10,30],['🍰','Торт',12,40]];openModal('Кормление — выбери еду',`<p style="font-size:13px">У тебя <b>${S.coins} 🪙</b>. Каждая еда стоит монеты.</p><div class="choices">${food.map(f=>`<button class="choice" data-food="${f[2]}" data-gain="${f[3]}">${f[0]}<b>${f[1]}</b><small>${f[2]} 🪙 · +${f[3]} голода</small></button>`).join('')}</div>`);document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{let cost=+b.dataset.food;if(S.coins<cost){say('Не хватает монет 🪙');return}S.coins-=cost;S.hunger=clamp(S.hunger+(+b.dataset.gain));S.mood=clamp(S.mood+4);save();render();closeModal();say('М-м! Спасибо за вкусняшку ♥')})}
$('#rest').onclick=()=>{if(running){say('Сначала поставь таймер на паузу.');return}sleeping=true;S.energy=clamp(S.energy+10);S.mood=clamp(S.mood+5);save();render();say('Zzz... не буди меня...');setTimeout(()=>{sleeping=false;render()},9000)};
$('#wardrobe').onclick=()=>{let o=[['classic','💙','Классика'],['hoodie','🖤','Капюшон'],['home','🏠','Домашний'],['sleep','🌙','Пижама'],['pink','💗','Праздничный'],['cyber','⚡','Киберпанк']];openModal('Гардероб',`<p style="font-size:13px">Наряд меняется сразу — каждый стиль визуально отличается.</p><div class="choices">${o.map(x=>`<button class="choice ${S.outfit===x[0]?'selected':''}" data-outfit="${x[0]}">${x[1]}<b>${x[2]}</b></button>`).join('')}</div>`);document.querySelectorAll('[data-outfit]').forEach(b=>b.onclick=()=>{S.outfit=b.dataset.outfit;sleeping=false;save();render();closeModal();say('Вот так уже лучше!')})};
$('#ach').onclick=()=>openModal('Достижения',`<div class="choices"><div class="choice">🪙<b>${S.coins}</b><small>монет</small></div><div class="choice">⏱️<b>${S.sessions}</b><small>фокус-сессий</small></div><div class="choice">⭐<b>${S.level}</b><small>уровень · ${S.xp} XP</small></div></div>`);
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{if(running)return;total=+b.dataset.min*60;remain=total;document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
$('#start').onclick=()=>{if(running){clearInterval(iv);running=false;$('#start').textContent='▶';say('Пауза. Возвращайся, когда будешь готов.');return}sleeping=false;running=true;$('#start').textContent='Ⅱ';say('Фокусируемся вместе ♥');iv=setInterval(()=>{remain--;render();if(remain<=0){clearInterval(iv);running=false;let mins=Math.round(total/60),reward=rewards[mins]||20;S.coins+=reward;S.sessions++;S.xp+=50;if(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;say(`Новый уровень! +${reward} 🪙 ⭐`)}else say(`Сессия завершена! +${reward} 🪙 ♥`);save();remain=total;$('#start').textContent='▶';render()}},1000)};
$('#reset').onclick=()=>{clearInterval(iv);running=false;remain=total;$('#start').textContent='▶';render()};
function openGames(){openModal('Мини-игры',`<p style="font-size:13px">Выбери игру. За победу или хороший результат — немного настроения.</p><div class="choices"><button class="choice" id="sudokuGame">🔢<b>Судоку</b><small>мини-головоломка</small></button><button class="choice" id="bombGame">💣<b>Ловить бомбочки</b><small>лови хорошие!</small></button><button class="choice" id="tttGame">⭕<b>Крестики-нолики</b><small>против Jinx</small></button></div>`);$('#sudokuGame').onclick=startSudoku;$('#bombGame').onclick=startBomb;$('#tttGame').onclick=startTTT}
$('#games').onclick=openGames;
function startSudoku(){let grid=[1,0,3,0,5,6,7,0,9,0,5,6,7,8,0,1,2,0,7,8,0,1,2,3,0,5,6,2,3,4,5,0,7,8,9,0,5,6,7,8,9,1,2,0,4,0,9,1,2,0,4,5,6,7,8,0,1,2,3,4,5,0,7,8,9,0,2,3,4,5,6,7,8,9,1,2,3,0,5,6,7,8,9];let cells=Array.from({length:81},(_,i)=>grid[i]||0);openModal('Судоку',`<div class="status">Заполни пустые клетки. Для упрощённой версии достаточно не повторять число в строке.</div><div class="gamegrid sudoku" id="sgrid"></div><div class="status" id="sstat"></div>`);let sg=$('#sgrid');cells.forEach((v,i)=>{let b=document.createElement('button');b.className='gamecell '+(v?'fixed':'');b.textContent=v||'';if(!v)b.onclick=()=>{let n=((+b.textContent||0)%9)+1;b.textContent=n;checkSudoku()};sg.appendChild(b)});function checkSudoku(){let vals=[...sg.children].map(b=>+b.textContent||0);if(vals.every(Boolean)){$('#sstat').textContent='Готово! Молодец ♥';S.mood=clamp(S.mood+15);save();render()}}}
function startBomb(){openModal('Ловить бомбочки',`<div class="status">Нажимай на 💙 и ⭐, но не нажимай на 💣. 20 секунд!</div><div class="bombarea" id="bombarea"><div class="catcher">🧺</div></div><div class="status" id="bstat">0 очков · 20 сек</div>`);let area=$('#bombarea'),score=0,time=20,done=false;let spawn=setInterval(()=>{if(done)return;let b=document.createElement('button');b.className='bomb';let good=Math.random()>.32;b.textContent=good?(Math.random()>.5?'💙':'⭐'):'💣';b.style.left=Math.random()*88+'%';b.style.top=Math.random()*78+'%';b.onclick=()=>{if(done)return;if(good){score++;b.remove();}else{score=Math.max(0,score-2);b.remove()}$('#bstat').textContent=score+' очков · '+time+' сек'};area.appendChild(b);setTimeout(()=>b.remove(),1800)},450);let tick=setInterval(()=>{time--;$('#bstat').textContent=score+' очков · '+time+' сек';if(time<=0){done=true;clearInterval(spawn);clearInterval(tick);S.mood=clamp(S.mood+Math.min(20,score));save();$('#bstat').textContent=`Финиш! ${score} очков ♥`;setTimeout(closeModal,900)}},1000)}
function startTTT(){let board=Array(9).fill(''),turn='X';openModal('Крестики-нолики',`<div class="status" id="ttstat">Твой ход — ❌</div><div class="gamegrid" id="tttgrid"></div>`);let g=$('#tttgrid');function win(b){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(x=>b[x[0]]&&b[x[0]]===b[x[1]]&&b[x[1]]===b[x[2]])}function draw(){return board.every(Boolean)}function ai(){let free=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(!free.length)return;let i=free[Math.floor(Math.random()*free.length)];board[i]='O';renderTTT();if(win(board)||draw())endTTT();else{$('#ttstat').textContent='Твой ход — ❌';turn='X'}}function renderTTT(){g.innerHTML='';board.forEach((v,i)=>{let b=document.createElement('button');b.className='gamecell';b.textContent=v?' '+v:'';b.onclick=()=>{if(board[i]||turn!=='X')return;board[i]='X';renderTTT();if(win(board)||draw()){endTTT();return}turn='O';$('#ttstat').textContent='Jinx думает…';setTimeout(ai,350)};g.appendChild(b)})}function endTTT(){let msg=win(board)?(board.includes('X')?'Ты победил! ♥':'Jinx победила 😈'): 'Ничья!';$('#ttstat').textContent=msg;if(board.includes('X')&&win(board)){S.mood=clamp(S.mood+20);save();render()}}renderTTT()}
setInterval(()=>{if(!running&&!sleeping){S.hunger=clamp(S.hunger-1);S.energy=clamp(S.energy-1);S.clean=clamp(S.clean-1);save();render()}},60000);
render();
</script></body></html>
